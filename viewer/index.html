<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tiles Point Cloud Viewer</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.109/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.109/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #cesiumContainer {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(42, 42, 42, 0.9);
            padding: 10px 15px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div id="cesiumContainer"></div>

    <div id="info">
        Press <strong>F</strong> to fly to tileset | Use <strong>Mouse</strong> to navigate
    </div>

    <script>
        // Initialize Cesium viewer with optimal settings
        const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false,
            timeline: false,
            baseLayerPicker: false,
            geocoder: false,
            homeButton: true,
            sceneModePicker: true,
            navigationHelpButton: true,
            fullscreenButton: true,
            vrButton: false,
            infoBox: true,
            selectionIndicator: true,
            skyBox: false,
            skyAtmosphere: false
        });

        // Configure scene with medium grey background
        viewer.scene.backgroundColor = Cesium.Color.GRAY;
        viewer.scene.skyBox = undefined;
        viewer.scene.skyAtmosphere = undefined;
        viewer.scene.sun = undefined;
        viewer.scene.moon = undefined;

        let currentTileset = null;

        // Auto-load tileset function
        async function loadTileset() {
            const url = '/data/output/tileset2/tileset.json'; // Change this path as needed

            try {
                console.log('Loading tileset from:', url);

                // Load tileset with optimal settings
                currentTileset = await Cesium.Cesium3DTileset.fromUrl(url);
                viewer.scene.primitives.add(currentTileset);

                // Apply optimal styling - white points with good visibility
                currentTileset.style = new Cesium.Cesium3DTileStyle({
                    color: "color('white')",
                    pointSize: 3
                });

                // Configure optimal point cloud shading
                if (currentTileset.pointCloudShading) {
                    currentTileset.pointCloudShading.attenuation = true;
                    currentTileset.pointCloudShading.eyeDomeLighting = true;
                    currentTileset.pointCloudShading.eyeDomeLightingStrength = 1.0;
                    currentTileset.pointCloudShading.eyeDomeLightingRadius = 1.0;
                    // Round points by default
                    currentTileset.pointCloudShading.normalShading = false;
                    currentTileset.pointCloudShading.backFaceCulling = false;
                    currentTileset.pointCloudShading.geometricErrorScale = 1.0;
                    currentTileset.pointCloudShading.maximumAttenuation = 10;
                    currentTileset.pointCloudShading.baseResolution = 0.1;
                }

                // Fly to tileset
                viewer.flyTo(currentTileset).then(() => {
                    console.log('Tileset loaded and positioned successfully');
                }).catch((error) => {
                    console.error('Error positioning camera:', error);
                });

                console.log('Tileset loaded successfully');

            } catch (error) {
                console.error('Error loading tileset:', error);
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                if (currentTileset) {
                    viewer.flyTo(currentTileset);
                }
            }
        });

        // Initialize viewer
        console.log('Initializing simplified point cloud viewer...');
        loadTileset();
    </script>
</body>

</html>
